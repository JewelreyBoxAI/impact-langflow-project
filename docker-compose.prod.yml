services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=.
      - POSTGRES_URL=${POSTGRES_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET}
      - ZOHO_REFRESH_TOKEN=${ZOHO_REFRESH_TOKEN}
      - SALESMSG_CLIENT_ID=${SALESMSG_CLIENT_ID}
      - SALESMSG_CLIENT_SECRET=${SALESMSG_CLIENT_SECRET}
      - SALESMSG_REFRESH_TOKEN=${SALESMSG_REFRESH_TOKEN}
      - SALESMSG_TEAM_ID=${SALESMSG_TEAM_ID}
      - SALESMSG_BASE_URL=${SALESMSG_BASE_URL}
      - LANGFLOW_BASE_URL=${LANGFLOW_BASE_URL:-http://langflow:7860}
      - LANGFLOW_API_KEY=${LANGFLOW_API_KEY}
    volumes:
      - ./backend:/app
      - ./flows:/app/flows
    restart: unless-stopped
    networks:
      - impact-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://4.236.160.148:8000
      - NEXT_PUBLIC_WS_BASE_URL=ws://4.236.160.148:8000
      - NEXT_PUBLIC_RECRUITING_FLOW_ID=91a7b05f-8b18-4369-b2df-316ebb9a844a
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - impact-network

  # LangFlow
  langflow:
    image: langflowai/langflow:1.6.0
    user: root
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_DATABASE_URL=${LANGFLOW_DATABASE_URL}
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SUPERUSER_USERNAME=admin
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_ADMIN_PASSWORD:-admin123}
      - LANGFLOW_SKIP_AUTH_AUTO_LOGIN=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MEM0_API_KEY=${MEM0_API_KEY}
      - BACKEND_URL=http://backend:8000
      - SMS_ENDPOINT=http://backend:8000/api/messaging/send-sms/
      - LANGFLOW_LOG_LEVEL=INFO
      - SALESMSG_CLIENT_ID=${SALESMSG_CLIENT_ID}
      - SALESMSG_TEAM_ID=${SALESMSG_TEAM_ID}
      - SALESMSG_CLIENT_SECRET=${SALESMSG_CLIENT_SECRET}
      - SALESMSG_REFRESH_TOKEN=${SALESMSG_REFRESH_TOKEN}
      - SALESMSG_BASE_URL=${SALESMSG_BASE_URL}
    volumes:
      - ./flows:/app/flows
      - langflow_data:/app/data
      - ./MCPServers:/app/MCPServers
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - impact-network

volumes:
  langflow_data:

networks:
  impact-network:
    driver: bridge